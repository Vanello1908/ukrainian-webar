<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const targets = document.querySelectorAll(".target");
            const videos = document.querySelectorAll(".video");

            for (let i = 0; i < targets.length; i++) {
                targets[i].addEventListener("targetFound", () => {
                    console.log(`Target ${i} found`);

                    videos[i].play().catch(console.error);
                });

                targets[i].addEventListener("targetLost", () => {
                    console.log(`Target ${i} lost`);

                    videos[i].pause();
                    videos[i].currentTime = 0;
                });
            }
        });
    </script>
</head>

<body>
    <a-scene
        mindar-image="imageTargetSrc: ./targets.mind;"
        color-space="sRGB"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
    >

        <a-assets>
            <video class="video" id="video1"
                   src="./1.mp4" loop playsinline preload="auto"></video>

            <video class="video" id="video2"
                   src="./2.mp4" loop playsinline preload="auto"></video>

            <video class="video" id="video3"
                   src="./3.mp4" loop playsinline preload="auto"></video>
        </a-assets>

        <a-camera
            position="0 0 0"
            look-controls="enabled: false"
        ></a-camera>

        <a-entity class="target" mindar-image-target="targetIndex: 0">
            <a-video src="#video1" width="1" height="0.5625"></a-video>
        </a-entity>

        <a-entity class="target" mindar-image-target="targetIndex: 1">
            <a-video src="#video2" width="1" height="0.5625"></a-video>
        </a-entity>

        <a-entity class="target" mindar-image-target="targetIndex: 2">
            <a-video src="#video3" width="1" height="0.5625"></a-video>
        </a-entity>

    </a-scene>
</body>
</html>
