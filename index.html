<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <script>
        document.addEventListener("DOMContentLoaded", () => {

            const targets = document.querySelectorAll(".target")
            const videos = document.querySelectorAll(".video")
            for (let i = 0; i < targets.length; i++) {
                targets[i].addEventListener("targetFound", () => {
                    videos[i].play().catch(console.error);
                });
                targets[i].addEventListener("targetLost", () => {
                    videos[i].pause();
                    videos[i].currentTime = 0;
                });
            }
        });
    </script>

</head>
<body>

    <a-scene
  mindar-image="imageTargetSrc: ./targets-test.mind;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>
  
        <a-assets>

            <video id="video1" class="video" src="./1.mp4" muted loop playsinline></video>
            <video id="video2" class="video" src="./2.mp4" muted loop playsinline></video>
            <video id="video3" class="video" src="./3.mp4" muted loop playsinline></video>

        </a-assets>

        <a-camera
    position="0 0 0"
    look-controls="enabled: false"
  ></a-camera>


        <a-entity id="target1" class="target" mindar-image-target="targetIndex: 0">
            <a-video src="#video1" position="0 0 0" height="0.5625" width="1"></a-video>
        </a-entity>

        <a-entity id="target2" class="target" mindar-image-target="targetIndex: 1">
            <a-video src="#video2" position="0 0 0" height="0.5625" width="1"></a-video>
        </a-entity>

        <a-entity id="target3" class="target" mindar-image-target="targetIndex: 2">
            <a-video src="#video3" position="0 0 0" height="0.5625" width="1"></a-video>
        </a-entity>

    </a-scene>

</body>
</html>
